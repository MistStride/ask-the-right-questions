# 构建检查（CI）：每次 push 到 main 自动执行。
# 注意：GitHub Pages 部署不依赖本 workflow —— 采用
#   Settings → Pages → Deploy from a branch: main / folder: /docs
# 构建产物已提交进 docs/ 目录（vite build outDir='docs'），push 后 Pages 自动更新。
name: CI Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # build 时会执行全部关卡的 Zod 校验 + 锚点校验，数据不合法会直接失败
      - name: Build (validates all level data)
        run: npm run build
