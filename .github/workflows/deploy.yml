# 质量门禁（CI）：每次 push 到 main 或 Pull Request 自动执行。
# 注意：GitHub Pages 部署不依赖本 workflow —— 采用
#   Settings → Pages → Deploy from a branch: main / folder: /docs
# 构建产物已提交进 docs/ 目录（vite build outDir='docs'），push 后 Pages 自动更新。
name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint source and tests
        run: npm run lint
      - name: Unit tests
        run: npm test
      # build 先执行 35 关 Zod/跨文件校验 + 独立锚点校验，再产出 docs/。
      - name: Validate content and build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # 启动与 GitHub Pages 同路径的 docs 预览，验证生产产物而不是开发服务器。
      - name: Smoke test all five engines on production preview
        run: node scripts/run-e2e.mjs
